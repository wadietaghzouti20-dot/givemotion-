              <div class="content"><div class="copy" data-enter="fade-up"><div class="eyebrow">{html.escape(ey)}</div><h1>{html.escape(head)}</h1><div class="body">{html.escape(body)}</div></div>{vis(kind,lang)}</div>
              <div class="footer"><span>{'MOINS D’ADMINISTRATION' if lang=='fr' else 'LESS ADMIN'}</span><b>@RENDEVO.DZ</b></div></section>''')
            return f'<!doctype html><html lang="{lang}" data-width="1080" data-height="1920" data-fps="30"><head><meta charset="utf-8"><style>{css}</style></head><body><main data-sequence>{"".join(parts)}</main></body></html>'
          for lang,d in data.items():
            wavs=[]; speech=[]; padded=[]
            for i,scene in enumerate(d["scenes"],1):
              mp3=TMP/f"{lang}-{i}.mp3"; wav=TMP/f"{lang}-{i}.wav"
              cmd([".venv/bin/edge-tts","--voice",d["voice"],"--rate=-4%","--text",scene[3],"--write-media",str(mp3)])
              cmd(["ffmpeg","-y","-i",str(mp3),"-af","apad=pad_dur=0.18","-ar","48000","-ac","1",str(wav)])
              speech.append(duration(mp3));padded.append(duration(wav));wavs.append(wav)
            total=sum(padded)
            pathlib.Path(f"compositions/daily-{lang}.html").write_text(page(lang,d["scenes"],padded),encoding="utf-8")
            with wave.open(str(wavs[0]),"rb") as first:
              params=first.getparams()
              with wave.open(str(OUT/f"{lang}-voice.wav"),"wb") as dst:
                dst.setparams(params)
                for p in wavs:
                  with wave.open(str(p),"rb") as src: dst.writeframes(src.readframes(src.getnframes()))
            music(OUT/f"{lang}-music.wav",total)
            cursor=0; cues=[]
            for i,(scene,sp,pad) in enumerate(zip(d["scenes"],speech,padded),1):
              cues.append(f"{i}\n{stamp(cursor)} --> {stamp(cursor+sp)}\n{wrap(scene[3],34 if lang=='fr' else 38)}\n")
              cursor+=pad
            (OUT/f"{lang}.srt").write_text("\n".join(cues),encoding="utf-8")
            ass_lines=["[Script Info]","ScriptType: v4.00+","PlayResX: 1080","PlayResY: 1920","WrapStyle: 2","ScaledBorderAndShadow: yes","","[V4+ Styles]","Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding","Style: Default,DejaVu Sans,32,&H00FFFFFF,&H000000FF,&H90000000,&H64000000,0,0,0,0,100,100,0,0,1,3,0,2,72,72,235,1","","[Events]","Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"]
            cursor=0
            for scene,sp,pad in zip(d["scenes"],speech,padded):
              subtitle=wrap(scene[3],34 if lang=="fr" else 38).replace("\n",r"\N")
              ass_lines.append(f"Dialogue: 0,{ass_stamp(cursor)},{ass_stamp(cursor+sp)},Default,,0,0,0,,{subtitle}")
              cursor+=pad
            (OUT/f"{lang}.ass").write_text("\n".join(ass_lines),encoding="utf-8")
            (OUT/f"{lang}-caption.txt").write_text(d["caption"]+"\n\n"+d["tags"]+"\n\nVOICEOVER:\n"+"\n".join(x[3] for x in d["scenes"]),encoding="utf-8")
            print(f"Prepared {lang}: {total:.2f}s, female neural voice.")
