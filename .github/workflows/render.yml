            return f'''<div class="visual cta" data-enter="zoom"><div class="orb"><span>R</span></div><div class="brand">RENDEVO</div><div class="subbrand">BOOKING SYSTEMS</div>
              <div class="pill">{'ÉCRIVEZ « RENDEVO » EN DM' if fr else 'DM “BOOKING” TO TALK'}　↗</div><div class="tiny">{'Créneaux vérifiés · Suivi · E-mail' if fr else 'Clear booking flow · Admin view · Email'}</div></div>'''
          def music(path,dur):
            sr=48000; chords=((73.42,110,146.83,220),(65.41,98,130.81,196),(55,82.41,110,164.81),(61.74,92.5,123.47,185)); a=array.array("h")
            for i in range(int(sr*dur)):
              t=i/sr; chord=chords[min(int(t/5.2),3)]
              pad=sum(math.sin(2*math.pi*f*t+j*.22) for j,f in enumerate(chord))*.0042
              beat=t%0.78; kick=math.sin(2*math.pi*58*t)*math.exp(-beat*25)*.018
              tick=math.sin(2*math.pi*1650*t)*math.exp(-((beat-.025)/.012)**2)*.0028
              fade=min(1,t,max(0,(dur-t)/1.1)); v=max(-.08,min(.08,(pad+kick+tick)*fade))
              a.append(int(v*32767)); a.append(int((v*.96+math.sin(2*math.pi*chord[2]*t)*.0006)*32767))
            with wave.open(str(path),"wb") as w:
              w.setnchannels(2);w.setsampwidth(2);w.setframerate(sr);w.writeframes(a.tobytes())
          def page(lang,scenes,durs):
            parts=[]
            for (ey,head,body,voice,kind),dur in zip(scenes,durs):
              parts.append(f'''<section class="scene" data-duration="{dur:.3f}" data-camera="push 1.035">
