name: RENDEVO Daily Reels
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer and voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-venv
          npm install --no-save givemotion
          npx givemotion install
          npx givemotion doctor
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install edge-tts
      - name: Prepare two original Reels and publishing package
        run: |
          mkdir -p compositions out /tmp/rendevo-voice
          cat > /tmp/build.py <<'PY'
          import html, pathlib, subprocess, wave, math, array, textwrap, json
          OUT=pathlib.Path("out"); TMP=pathlib.Path("/tmp/rendevo-voice")
          def cmd(a): subprocess.run(a,check=True,stdout=subprocess.DEVNULL if a[0]=="ffmpeg" else None)
          def duration(p):
            return float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(p)],text=True).strip())
          def stamp(t):
            ms=round(t*1000); h,ms=divmod(ms,3600000); m,ms=divmod(ms,60000); s,ms=divmod(ms,1000)
            return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"
          def ass_stamp(t):
            cs=round(t*100)
            h,cs=divmod(cs,360000); m,cs=divmod(cs,6000); s,cs=divmod(cs,100)
            return f"{h}:{m:02d}:{s:02d}.{cs:02d}"
          def wrap(s,w):
            return "\n".join(textwrap.wrap(s,w,break_long_words=False,break_on_hyphens=False))
          data={
           "fr":{"voice":"fr-FR-DeniseNeural","caption":"Même après la fermeture, un patient peut chercher un rendez-vous. Une page de demande en ligne lui permet de consulter les créneaux et d’envoyer sa demande. L’équipe la retrouve ensuite dans son tableau de suivi. Cabinet en Algérie ? Écrivez « RENDEVO » en DM.","tags":"#RENDEVO #Oran #Algerie #RendezVousEnLigne #CabinetMedical #ReservationEnLigne","scenes":[
            ("APRÈS LA FERMETURE","Il est 22 h 47.","Le cabinet est fermé, mais une demande de rendez-vous peut encore arriver.","Il est 22 h 47. Le cabinet est fermé, mais une personne cherche encore un rendez-vous.","afterhours"),
            ("UNE PAGE ACCESSIBLE","La demande se fait en ligne.","Le patient peut consulter les créneaux et envoyer une demande depuis son téléphone.","Avec RENDEVO, elle consulte les créneaux disponibles et envoie sa demande en ligne.","booking"),
            ("CHOISIR UN CRÉNEAU","Date. Horaire. Demande.","Un parcours mobile présente les horaires disponibles avant l’envoi.","Elle choisit une date, un horaire disponible et transmet ses coordonnées.","calendar"),
            ("CÔTÉ ÉQUIPE","La demande reste visible.","L’équipe retrouve la demande et son statut dans le tableau d’administration.","Le lendemain, l’équipe retrouve la demande dans son tableau de suivi.","sheet"),
            ("RENDEVO","Même après la fermeture.","Un parcours de réservation plus clair pour votre cabinet.","Vous gérez un cabinet ? Écrivez RENDEVO en DM.","cta")]},
           "en":{"voice":"en-US-JennyNeural","caption":"A missed call doesn’t have to be the end of the booking journey. A clear online request page gives patients another way to choose a service, date and available time. Your team can follow incoming requests from an admin view. Want to explore this for your clinic? DM “BOOKING”.","tags":"#RENDEVO #ClinicBooking #OnlineAppointments #PatientExperience #AppointmentSystem #RENDEVOdz","scenes":[
            ("MISSED THE CALL?","Give them a next step.","A booking page can let patients send a request when the phone is busy.","Missed the call? Give patients a clear next step with an online appointment request.","missedcall"),
            ("THE BOOKING PAGE","A simple online request.","Patients can choose a service, date and available time, then send their details.","A clear booking page lets patients choose a service, date and available time.","booking_en"),
            ("CHOOSE A TIME","See the available slots.","The mobile flow shows date and time options before a request is sent.","They choose a date and available time, then send their request.","calendar_en"),
            ("YOUR TEAM’S VIEW","Requests in one place.","Review incoming appointment requests and their status in the admin view.","Your team follows incoming requests from one admin view.","sheet_en"),
            ("RENDEVO","A clearer next step.","Explore a booking workflow shaped around your clinic.","Want to explore this for your clinic? DM BOOKING.","cta_en")]}
          }
          css="""
          *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131c;color:#f5f8f8;font-family:Arial,Helvetica,sans-serif}
          .scene{width:1080px;height:1920px;position:relative;overflow:hidden;padding:86px 78px;background:radial-gradient(ellipse at 82% 28%,rgba(26,112,101,.26),transparent 40%),linear-gradient(145deg,#07131c,#102632 55%,#08141e)}
          .scene:before{content:"";position:absolute;width:760px;height:760px;border:1px solid rgba(137,226,195,.12);border-radius:50%;right:-390px;top:430px}
          .scene:after{content:"";position:absolute;left:0;right:0;top:0;height:48px;background:#07131c;z-index:9;pointer-events:none}
          .top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:4}.logo{font-size:31px;letter-spacing:7px;font-weight:800}.logo span{color:#8de2c1}.topnote{font-size:16px;letter-spacing:3px;color:#77929c}
          .content{position:absolute;left:78px;right:58px;top:390px;bottom:290px;display:grid;grid-template-columns:38% 62%;align-items:center;gap:12px;z-index:2}
          .copy{padding-right:8px;z-index:3}.eyebrow{font-size:16px;letter-spacing:3px;color:#8de2c1;font-weight:700;margin-bottom:25px}
          h1{font-size:56px;line-height:1.08;letter-spacing:-1.8px;margin:0 0 22px;max-width:360px}.body{font-size:22px;line-height:1.45;color:#b6c8cc;max-width:360px}
          .visual{position:relative;z-index:2;min-width:0}.footer{position:absolute;left:78px;right:78px;bottom:82px;display:flex;justify-content:space-between;color:#76909a;font-size:17px;letter-spacing:3px;z-index:4}.footer b{color:#8de2c1}
          .stack{height:820px;padding:80px 10px 30px 25px}.vlabel{font-size:15px;letter-spacing:3px;color:#8de2c1;margin:0 0 28px 22px}
          .notice{display:flex;align-items:center;gap:18px;background:rgba(21,43,55,.96);border:1px solid rgba(143,181,186,.25);border-radius:22px;padding:25px 22px;margin:0 0 22px;min-height:125px;box-shadow:0 22px 55px rgba(0,0,0,.22)}
          .notice:nth-child(3){transform:translateX(26px)}.notice:nth-child(4){transform:translateX(4px)}.notice b{display:block;font-size:20px;line-height:1.25}.notice small{display:block;font-size:15px;color:#8da5ab;margin-top:10px}.notice em{margin-left:auto;color:#8da5ab;font-size:14px;font-style:normal}
          .dot{width:13px;height:13px;border-radius:50%;flex:none}.mint{background:#8de2c1}.amber{background:#e8b66e}.blue{background:#7cb7d9}.scatter{font-size:17px;color:#91aab0;margin:35px 0 0 26px}
          .phonewrap{display:flex;justify-content:center;align-items:center;height:900px}.phone{width:420px;min-height:790px;border-radius:48px;background:#f5f8f8;color:#18313b;padding:36px 30px;border:8px solid #1b3039;box-shadow:0 34px 90px rgba(0,0,0,.35)}
          .island{width:115px;height:15px;background:#1b3039;border-radius:20px;margin:-18px auto 38px}.phead{display:flex;justify-content:space-between;font-size:19px;letter-spacing:3px}
          .ptitle{font-size:28px;font-weight:800;margin-top:38px}.pcap{font-size:12px;letter-spacing:2px;color:#208b7c;margin-top:10px}
          .flabel{font-size:15px;color:#627b83;margin:34px 0 12px}.field{height:72px;border:1px solid #d7e1e2;border-radius:15px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-size:18px;background:white}
          .date{height:66px;border-radius:15px;background:#eaf3f1;color:#1a6e62;display:flex;align-items:center;padding:0 18px;font-size:16px}.selected{border:2px solid #53a998;background:#f2faf8}
          .send{margin-top:38px;height:72px;border-radius:16px;background:#176d63;color:white;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
          .calendar{width:100%;max-width:570px;background:#f5f8f7;color:#203a34;border-radius:25px;padding:27px;box-shadow:0 28px 75px rgba(0,0,0,.32);transform:rotate(-1deg)}
          .calhead{display:flex;justify-content:space-between;align-items:center;font-size:18px;letter-spacing:2px;margin-bottom:24px;color:#31594f}
          .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
          .day{padding:16px 0;text-align:center;border-radius:10px;background:#e8efeb;color:#5e746b;font-size:17px}
          .day.active{background:#176d63;color:#fff;font-weight:800;box-shadow:0 0 0 5px #176d6322}
          .day.busy{background:#f2dfdc;color:#b66d61;text-decoration:line-through}
          .slots{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}
          .slot{padding:12px 14px;border:1px solid #a4c5b6;border-radius:11px;color:#176d63;font-size:15px;background:#fff}
          .workspace{padding:90px 0 0}.window{border-radius:24px;background:#f4f7f7;color:#203941;overflow:hidden;box-shadow:0 30px 75px rgba(0,0,0,.3);transform:rotate(1.5deg)}
          .wtop{height:70px;background:#e8eeee;display:flex;align-items:center;gap:9px;padding:0 22px;font-size:14px;color:#60767d;letter-spacing:1px}.wtop i{width:11px;height:11px;border-radius:50%;background:#9eb2b3}
          .cols,.r{display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:6px;align-items:center;padding:22px 20px}.cols{font-size:12px;letter-spacing:2px;color:#789096}.r{border-top:1px solid #e1e9e9;font-size:14px}.r b{font-size:15px}.r em{font-size:12px;font-style:normal;color:#187566;background:#e2f2ed;border-radius:20px;padding:8px;text-align:center}
          .mail{display:flex;align-items:center;gap:16px;background:#1a3943;border:1px solid rgba(141,226,193,.24);padding:22px;border-radius:20px;margin:34px 0 0 35px}.mailicon{width:50px;height:50px;border-radius:14px;background:#225d59;display:grid;place-items:center;font-size:23px;color:#9ce7cc}.mail b{display:block;font-size:17px}.mail small{display:block;color:#9db3b8;font-size:13px;margin-top:7px}.mail>span{margin-left:auto;color:#8de2c1}
          .cta{text-align:center;padding-top:80px}.orb{width:190px;height:190px;border-radius:50%;margin:0 auto 38px;border:1px solid rgba(141,226,193,.5);background:radial-gradient(circle at 35% 30%,#276f64,#102d35 72%);display:grid;place-items:center;box-shadow:0 0 90px rgba(49,160,130,.18)}.orb span{font-size:92px;font-weight:800;color:#d7f8e9}
          .brand{font-size:43px;letter-spacing:11px;font-weight:800}.subbrand{font-size:15px;letter-spacing:5px;color:#8de2c1;margin-top:14px}.pill{margin:62px auto 0;background:#8de2c1;color:#08221b;border-radius:18px;padding:25px 20px;font-size:17px;font-weight:800;max-width:440px}.tiny{margin-top:30px;color:#9bb2b7;font-size:16px}
          .copy{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.visual{animation:floatin .95s cubic-bezier(.2,.8,.2,1) both}
          @keyframes rise{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}@keyframes floatin{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

          .conflict{height:820px;padding:95px 12px 0 25px;position:relative}
          .request{position:relative;display:flex;align-items:center;gap:15px;background:#173844;border:1px solid rgba(141,226,193,.25);border-radius:18px;padding:20px 18px;margin-bottom:17px;box-shadow:0 20px 45px rgba(0,0,0,.24)}
          .request:nth-child(3){margin-left:28px}.request b{display:block;font-size:18px}.request small{display:block;color:#9bb3b8;font-size:13px;margin-top:6px}.request em{margin-left:auto;font-style:normal;font-size:12px;color:#9db4b9}
          .avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#285c58;color:#bdf1da;font-weight:800}
          .request:nth-child(3) .avatar{background:#5a4141;color:#ffd3c9}
          .calendar-mini{background:#f5f8f7;color:#25413c;border-radius:20px;padding:22px 20px;margin-top:42px;box-shadow:0 24px 60px rgba(0,0,0,.3);transform:rotate(-1deg)}
          .calrow{display:flex;align-items:center;justify-content:space-between;padding:18px 4px;border-bottom:1px solid #e1e9e6;font-size:18px}.calrow:last-child{border:0}
          .slot-ok,.slot-no{padding:9px 12px;border-radius:10px;font-size:14px}.slot-ok{background:#e1f2eb;color:#18715e}.slot-no{background:#f5e2df;color:#a14f49;text-decoration:line-through}
          .checknote{margin:24px 0 0 8px;color:#8de2c1;font-size:15px;letter-spacing:2px}
          .desk{height:850px;padding:90px 8px 0 25px}.deskbar{font-size:15px;letter-spacing:3px;color:#8de2c1;margin:0 0 24px 8px}
          .deskgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;transform:rotate(-1deg)}
