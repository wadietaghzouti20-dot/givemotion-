name: Render Givemotion video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: HTML composition to render
        required: true
        default: video.html
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Givemotion and browser
        run: |
          npm install --no-save givemotion
          npx givemotion install
          npx givemotion doctor
      - name: Render MP4
        run: |
          mkdir -p out
          npx givemotion render "${{ inputs.composition }}" -o out/video.mp4 --quality standard
      - uses: actions/upload-artifact@v4
        with:
          name: givemotion-mp4
          path: out/video.mp4
          if-no-files-found: error
          retention-days: 7
