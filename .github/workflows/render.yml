          .deskcard small{display:block;font-size:12px;letter-spacing:2px;color:#8de2c1;margin-bottom:24px}.deskcard b{display:block;font-size:20px;line-height:1.2}.deskcard em{display:block;font-size:13px;color:#9bb3b8;font-style:normal;margin-top:14px}
          .deskcard.paper{background:#e9d9bd;color:#243b3b;transform:translateY(10px) rotate(2deg)}.deskcard.paper small,.deskcard.paper em{color:#66756e}
          .deskcard.clock{background:#1b4c4b;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.deskcard.clock b{font-size:52px;color:#d8f5e8}.deskcard.clock em{color:#a8d8c6}
