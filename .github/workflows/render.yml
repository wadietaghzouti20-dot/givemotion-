          .nighttime{font-size:76px;letter-spacing:-4px;font-weight:800;color:#dff8ed}.nightlabel{font-size:15px;letter-spacing:3px;color:#8de2c1;margin:10px 0 0}
          .nightrequest{display:flex;gap:17px;align-items:center;background:#f2f6f4;color:#19343a;border-radius:19px;padding:23px;margin:0 0 18px}
          .nighticon{width:52px;height:52px;border-radius:15px;background:#d9eee6;color:#176d63;display:grid;place-items:center;font-size:25px;font-weight:800;flex:none}
          .nightrequest b{font-size:19px;display:block}.nightrequest small{font-size:14px;color:#6e8587;display:block;margin-top:7px}
          .nightfoot{font-size:15px;letter-spacing:2px;color:#8de2c1;margin:24px 0 0 8px}
