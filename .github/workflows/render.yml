      - name: Render, subtitle, mix and verify
        env:
          GIVEMOTION_NO_SANDBOX: "1"
        run: |
          set -e
          for lang in fr en; do
            up=$(printf '%s' "$lang" | tr '[:lower:]' '[:upper:]')
            npx givemotion render "compositions/daily-$lang.html" -o "out/$lang-silent.mp4" --quality standard
            ffmpeg -y -i "out/$lang-silent.mp4" -i "out/$lang-voice.wav" -i "out/$lang-music.wav" \
              -filter_complex "[0:v]ass=out/$lang.ass[vout];[1:a]volume=1.0[v];[2:a]volume=0.22[m];[v][m]amix=inputs=2:duration=first:dropout_transition=1[a]" \
              -map "[vout]" -map "[a]" -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -r 30 -c:a aac -b:a 192k -shortest -movflags +faststart "out/RENDEVO_"$up"_2026-11-16.mp4"
            ffmpeg -y -ss 0.8 -i "out/RENDEVO_"$up"_2026-11-16.mp4" -frames:v 1 -q:v 2 "out/RENDEVO_"$up"_cover.jpg"
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json "out/RENDEVO_"$up"_2026-11-16.mp4" > "out/"$lang"-verification.json"
            cat "out/"$lang"-verification.json"
          done
          python3 - <<'PY'
          import json, pathlib
          for lang in ("fr","en"):
            d=json.loads(pathlib.Path(f"out/{lang}-verification.json").read_text())
            v=next(s for s in d["streams"] if s.get("codec_type")=="video")
            sec=float(d["format"]["duration"])
            assert v["codec_name"]=="h264" and v["width"]==1080 and v["height"]==1920
            assert 15 <= sec <= 30, (lang,sec)
            print(f"VERIFIED {lang}: H.264 1080x1920, {sec:.2f}s")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RENDEVO-Daily-Reels-2026-11-16
          path: |
            out/RENDEVO_*.mp4
            out/RENDEVO_*_cover.jpg
            out/*-caption.txt
            out/*.srt
            out/*.ass
            out/CONTENT_PLAN.md
            out/*-verification.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish downloadable MP4s
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -e
          mkdir -p /tmp/rendevo-public
          cp out/RENDEVO_*.mp4 out/RENDEVO_*_cover.jpg out/*-caption.txt out/*.srt out/CONTENT_PLAN.md out/*-verification.json /tmp/rendevo-public/
          git init /tmp/rendevo-public-repo
          git -C /tmp/rendevo-public-repo config user.name "github-actions[bot]"
          git -C /tmp/rendevo-public-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/rendevo-public/* /tmp/rendevo-public-repo/
          git -C /tmp/rendevo-public-repo add .
          git -C /tmp/rendevo-public-repo commit -m "Daily RENDEVO Reels 2026-11-16"
          git -C /tmp/rendevo-public-repo remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C /tmp/rendevo-public-repo push origin HEAD:reel-deliveries --force
