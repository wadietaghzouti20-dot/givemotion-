          .callpanel{background:#f3f7f6;color:#19353b;border-radius:28px;padding:28px 25px;box-shadow:0 28px 70px rgba(0,0,0,.3);transform:rotate(-1deg)}
          .calltop{display:flex;justify-content:space-between;font-size:13px;letter-spacing:2px;color:#6a8185;margin-bottom:28px}
          .callrow{display:flex;align-items:center;gap:17px;padding:22px 0;border-top:1px solid #dfe8e6}
          .callbadge{width:58px;height:58px;border-radius:50%;background:#f5e2df;color:#b55d55;display:grid;place-items:center;font-size:27px;font-weight:800;flex:none}
          .callrow b{font-size:20px;display:block}.callrow small{font-size:14px;color:#70868a;display:block;margin-top:7px}
          .nextstep{margin-top:26px;background:#173d45;color:#f4faf7;border-radius:20px;padding:24px}
          .nextstep small{font-size:13px;letter-spacing:2px;color:#8de2c1}.nextstep b{display:block;font-size:22px;margin-top:13px}.nextstep em{display:block;font-size:14px;color:#b5c9c8;font-style:normal;margin-top:9px}
          """
          def vis(kind,lang):
            fr=lang=="fr"
            if kind=="conflict":
              return f'''<div class="visual conflict" data-enter="zoom"><div class="vlabel">{'DEMANDES REÇUES' if fr else 'REQUESTS RECEIVED'}</div>
              <div class="request"><span class="avatar">A</span><div><b>{'Demande · 10:30' if fr else 'Request · 10:30'}</b><small>{'Nouveau rendez-vous' if fr else 'New appointment'}</small></div><em>01</em></div>
              <div class="request"><span class="avatar">B</span><div><b>{'Même créneau · 10:30' if fr else 'Same slot · 10:30'}</b><small>{'Créneau déjà réservé' if fr else 'Already reserved'}</small></div><em>02</em></div>
              <div class="calendar-mini"><div class="calrow"><span>10:15</span><span class="slot-ok">{'Disponible' if fr else 'Available'}</span></div><div class="calrow"><span>10:30</span><span class="slot-no">{'Réservé' if fr else 'Reserved'}</span></div><div class="calrow"><span>10:45</span><span class="slot-ok">{'Disponible' if fr else 'Available'}</span></div></div>
              <div class="checknote">{'VÉRIFIER AVANT DE PROPOSER' if fr else 'CHECK BEFORE OFFERING'}</div></div>'''
            if kind=="afterhours":
              return f'''<div class="visual afterhours" data-enter="zoom"><div class="nightcard"><div class="nighttime">22:47</div><div class="nightlabel">APRÈS LA FERMETURE</div></div>
              <div class="nightrequest"><span class="nighticon">✉</span><div><b>Demande de rendez-vous</b><small>Reçue en ligne · À consulter</small></div></div>
              <div class="nightrequest"><span class="nighticon">✓</span><div><b>Page de réservation accessible</b><small>Le patient peut envoyer sa demande</small></div></div>
              <div class="nightfoot">UNE DEMANDE PEUT ARRIVER APRÈS 18 H</div></div>'''
            if kind=="missedcall":
              return f'''<div class="visual missedcall" data-enter="zoom"><div class="callpanel"><div class="calltop"><span>CLINIC PHONE</span><span>09:42</span></div>
              <div class="callrow"><span class="callbadge">↘</span><div><b>Missed call</b><small>Incoming call · No answer</small></div></div>
              <div class="callrow"><span class="callbadge" style="background:#e4f0ed;color:#176d63">↗</span><div><b>Online booking page</b><small>A clear next step for patients</small></div></div>
              <div class="nextstep"><small>ANOTHER WAY TO SEND A REQUEST</small><b>Choose a service. Pick a time.</b><em>Send an appointment request online.</em></div></div></div>'''            if kind=="desk":
              return f'''<div class="visual desk" data-enter="zoom"><div class="deskbar">FRONT DESK / MONDAY</div><div class="deskgrid">
              <div class="deskcard"><small>PHONE</small><b>Missed call</b><em>09:42 · Callback needed</em></div>
              <div class="deskcard"><small>MESSAGE</small><b>Can I book?</b><em>09:44 · New request</em></div>
              <div class="deskcard paper"><small>PAPER NOTES</small><b>3 appointments</b><em>Rewrite the schedule</em></div>
              <div class="deskcard clock"><b>09:45</b><em>3 places to check</em></div></div><div class="deskfooter">One team. Too many places to check.</div></div>'''
            if kind in ("booking","booking_en"):
              return f'''<div class="visual phonewrap" data-enter="zoom"><div class="phone"><div class="island"></div><div class="phead"><b>RENDEVO</b><span>•••</span></div>
              <div class="ptitle">{'Prendre rendez-vous' if fr else 'Book an appointment'}</div><div class="pcap">{'EXEMPLE DE PARCOURS' if fr else 'ILLUSTRATIVE FLOW'}</div>
              <div class="flabel">{'Choisir un service' if fr else 'Choose a service'}</div><div class="field"><b>{'Consultation' if fr else 'Appointment'}</b><span>⌄</span></div>
              <div class="flabel">{'Choisir une date' if fr else 'Choose a date'}</div><div class="date"><b>{'18 NOV · MERCREDI' if fr else 'NOV 18 · WEDNESDAY'}</b></div>
              <div class="flabel">{'Horaire' if fr else 'Time'}</div><div class="field selected"><b>{'10:45 · Disponible' if fr else '10:45 AM · Available'}</b><span>✓</span></div>
              <div class="send">{'Envoyer la demande' if fr else 'Send request'}　→</div></div></div>'''
            if kind in ("calendar","calendar_en"):
              return f'''<div class="visual" data-enter="zoom"><div class="calendar"><div class="calhead"><b>{'CHOISIR UNE DATE' if fr else 'CHOOSE A DATE'}</b><span>{'NOVEMBRE' if fr else 'NOVEMBER'}</span></div><div class="days">
              <div class="day">16</div><div class="day">17</div><div class="day active">18</div><div class="day">19</div><div class="day busy">20</div><div class="day">21</div><div class="day">22</div>
              <div class="day">23</div><div class="day">24</div><div class="day">25</div><div class="day">26</div><div class="day">27</div><div class="day">28</div><div class="day">29</div></div>
              <div class="slots"><span class="slot">09:00</span><span class="slot">09:15</span><span class="slot">10:45</span></div></div></div>'''
            if kind in ("sheet","sheet_en"):
              return f'''<div class="visual workspace" data-enter="zoom"><div class="window"><div class="wtop"><i></i><i></i><i></i><b>{'SUIVI DES RENDEZ-VOUS' if fr else 'APPOINTMENT OVERVIEW'}</b></div>
              <div class="cols"><span>SERVICE</span><span>DATE</span><span>{'STATUT' if fr else 'STATUS'}</span></div>
              <div class="r"><b>Consultation</b><span>18 NOV</span><em>{'Reçu' if fr else 'Received'}</em></div>
              <div class="r"><b>{'Contrôle' if fr else 'Follow-up'}</b><span>19 NOV</span><em>{'Confirmé' if fr else 'Confirmed'}</em></div>
              <div class="r"><b>{'Nouvelle demande' if fr else 'New request'}</b><span>20 NOV</span><em>{'À traiter' if fr else 'To review'}</em></div></div></div>'''
            if kind in ("mail","mail_en"):
