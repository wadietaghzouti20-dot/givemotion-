name: RENDEVO Daily Reels
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/render.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer and voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-venv
          npm install --no-save givemotion
          npx givemotion install
          npx givemotion doctor
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install edge-tts
      - name: Prepare two original Reels and publishing package
        run: |
          mkdir -p compositions out /tmp/rendevo-voice
          cat > /tmp/build.py <<'PY'
          import html, pathlib, subprocess, wave, math, array, textwrap, json
          OUT=pathlib.Path("out"); TMP=pathlib.Path("/tmp/rendevo-voice")
          def cmd(a): subprocess.run(a,check=True,stdout=subprocess.DEVNULL if a[0]=="ffmpeg" else None)
          def duration(p):
            return float(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",str(p)],text=True).strip())
          def stamp(t):
            ms=round(t*1000); h,ms=divmod(ms,3600000); m,ms=divmod(ms,60000); s,ms=divmod(ms,1000)
            return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"
          def wrap(s,w):
            return "\n".join(textwrap.wrap(s,w,break_long_words=False,break_on_hyphens=False))
          data={
           "fr":{"voice":"fr-FR-DeniseNeural","caption":"Les demandes arrivent sur plusieurs canaux ? Un parcours de réservation clair peut aider votre équipe à mieux les suivre. Avec RENDEVO, vos patients peuvent envoyer leur demande en ligne et votre équipe retrouve les informations dans un tableau de suivi. Parlons de votre cabinet en DM.","tags":"#RENDEVO #Oran #Algerie #ReservationEnLigne #CabinetMedical #EntrepriseAlgerienne","scenes":[
            ("LE QUOTIDIEN, EN VRAI","WhatsApp n’est pas un agenda.","Appels, messages et notes : les demandes se dispersent.","WhatsApp n’est pas un agenda. Appels, messages et notes dispersent les demandes. L’équipe doit ensuite tout retrouver.","messages"),
            ("CÔTÉ PATIENT","Une page. Une demande.","Un parcours mobile pour choisir un service et envoyer ses informations.","Avec RENDEVO, le patient ouvre une page mobile, choisit son service et envoie sa demande.","booking"),
            ("IL CHOISIT SON CRÉNEAU","Dates et horaires disponibles.","Le patient consulte les disponibilités avant d’envoyer sa demande.","Il consulte les dates et horaires disponibles avant d’envoyer ses coordonnées.","calendar"),
            ("CÔTÉ ÉQUIPE","Les demandes, au même endroit.","Un tableau de suivi et des confirmations par e-mail selon la configuration.","Votre équipe retrouve les demandes dans un tableau de suivi. Une confirmation e-mail peut être envoyée selon la configuration.","sheet"),
            ("RENDEVO","Moins de messages éparpillés.","Des systèmes de réservation adaptés aux activités sur rendez-vous.","RENDEVO crée des systèmes adaptés aux rendez-vous. Cabinet en Algérie ? Écrivez-nous RENDEVO en DM.","cta")]},
           "en":{"voice":"en-US-JennyNeural","caption":"A customer shouldn’t have to wait for opening hours just to send a booking request. RENDEVO builds booking systems for appointment-based businesses, with a clear online request journey and an organized admin view. DM “BOOKING” to discuss your workflow.","tags":"#RENDEVO #OnlineBooking #SmallBusiness #AppointmentBooking #BusinessSystems #CustomerExperience","scenes":[
            ("AFTER HOURS","10:47 PM. Someone wants to book.","Your business is closed. Their need hasn’t disappeared.","It’s 10:47 PM. A customer wants to book, but your business is closed. They can still send a request.","night"),
            ("A BETTER FIRST STEP","Let them send a request online.","A mobile-friendly booking page, built around your business.","With RENDEVO, customers open a mobile-friendly page, choose a service and send their request.","booking_en"),
            ("THEY CHOOSE A TIME","Dates and times, clearly shown.","Customers can review availability before sending their details.","They can review available dates and times before submitting their details.","calendar_en"),
            ("YOUR TEAM STAYS IN CONTROL","A clearer way to manage requests.","A central admin view, with email confirmations as configured.","Your team reviews requests in one admin view. Email confirmations can be sent when configured.","sheet_en"),
            ("RENDEVO","Make booking easier.","Booking systems for appointment-based businesses. DM “BOOKING”.","RENDEVO builds booking systems for appointment-based businesses. Want a simpler booking journey? DM BOOKING.","cta_en")]}
          }
          css="""
          *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131c;color:#f5f8f8;font-family:Arial,Helvetica,sans-serif}
          .scene{width:1080px;height:1920px;position:relative;overflow:hidden;padding:86px 78px;background:radial-gradient(ellipse at 82% 28%,rgba(26,112,101,.26),transparent 40%),linear-gradient(145deg,#07131c,#102632 55%,#08141e)}
          .scene:before{content:"";position:absolute;width:760px;height:760px;border:1px solid rgba(137,226,195,.12);border-radius:50%;right:-390px;top:430px}
          .scene:after{content:"";position:absolute;left:0;right:0;top:0;height:48px;background:#07131c;z-index:9;pointer-events:none}
          .top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:4}.logo{font-size:31px;letter-spacing:7px;font-weight:800}.logo span{color:#8de2c1}.topnote{font-size:16px;letter-spacing:3px;color:#77929c}
          .content{position:absolute;left:78px;right:58px;top:390px;bottom:290px;display:grid;grid-template-columns:38% 62%;align-items:center;gap:12px;z-index:2}
          .copy{padding-right:8px;z-index:3}.eyebrow{font-size:16px;letter-spacing:3px;color:#8de2c1;font-weight:700;margin-bottom:25px}
          h1{font-size:56px;line-height:1.08;letter-spacing:-1.8px;margin:0 0 22px;max-width:360px}.body{font-size:22px;line-height:1.45;color:#b6c8cc;max-width:360px}
          .visual{position:relative;z-index:2;min-width:0}.footer{position:absolute;left:78px;right:78px;bottom:82px;display:flex;justify-content:space-between;color:#76909a;font-size:17px;letter-spacing:3px;z-index:4}.footer b{color:#8de2c1}
          .stack{height:820px;padding:80px 10px 30px 25px}.vlabel{font-size:15px;letter-spacing:3px;color:#8de2c1;margin:0 0 28px 22px}
          .notice{display:flex;align-items:center;gap:18px;background:rgba(21,43,55,.96);border:1px solid rgba(143,181,186,.25);border-radius:22px;padding:25px 22px;margin:0 0 22px;min-height:125px;box-shadow:0 22px 55px rgba(0,0,0,.22)}
          .notice:nth-child(3){transform:translateX(26px)}.notice:nth-child(4){transform:translateX(4px)}.notice b{display:block;font-size:20px;line-height:1.25}.notice small{display:block;font-size:15px;color:#8da5ab;margin-top:10px}.notice em{margin-left:auto;color:#8da5ab;font-size:14px;font-style:normal}
          .dot{width:13px;height:13px;border-radius:50%;flex:none}.mint{background:#8de2c1}.amber{background:#e8b66e}.blue{background:#7cb7d9}.scatter{font-size:17px;color:#91aab0;margin:35px 0 0 26px}
          .phonewrap{display:flex;justify-content:center;align-items:center;height:900px}.phone{width:420px;min-height:790px;border-radius:48px;background:#f5f8f8;color:#18313b;padding:36px 30px;border:8px solid #1b3039;box-shadow:0 34px 90px rgba(0,0,0,.35)}
          .island{width:115px;height:15px;background:#1b3039;border-radius:20px;margin:-18px auto 38px}.phead{display:flex;justify-content:space-between;font-size:19px;letter-spacing:3px}
          .ptitle{font-size:28px;font-weight:800;margin-top:38px}.pcap{font-size:12px;letter-spacing:2px;color:#208b7c;margin-top:10px}
          .flabel{font-size:15px;color:#627b83;margin:34px 0 12px}.field{height:72px;border:1px solid #d7e1e2;border-radius:15px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-size:18px;background:white}
          .date{height:66px;border-radius:15px;background:#eaf3f1;color:#1a6e62;display:flex;align-items:center;padding:0 18px;font-size:16px}.selected{border:2px solid #53a998;background:#f2faf8}
          .send{margin-top:38px;height:72px;border-radius:16px;background:#176d63;color:white;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
          .calendar{width:100%;max-width:570px;background:#f5f8f7;color:#203a34;border-radius:25px;padding:27px;box-shadow:0 28px 75px rgba(0,0,0,.32);transform:rotate(-1deg)}
          .calhead{display:flex;justify-content:space-between;align-items:center;font-size:18px;letter-spacing:2px;margin-bottom:24px;color:#31594f}
          .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
          .day{padding:16px 0;text-align:center;border-radius:10px;background:#e8efeb;color:#5e746b;font-size:17px}
          .day.active{background:#176d63;color:#fff;font-weight:800;box-shadow:0 0 0 5px #176d6322}
          .day.busy{background:#f2dfdc;color:#b66d61;text-decoration:line-through}
          .slots{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}
          .slot{padding:12px 14px;border:1px solid #a4c5b6;border-radius:11px;color:#176d63;font-size:15px;background:#fff}
          .workspace{padding:90px 0 0}.window{border-radius:24px;background:#f4f7f7;color:#203941;overflow:hidden;box-shadow:0 30px 75px rgba(0,0,0,.3);transform:rotate(1.5deg)}
          .wtop{height:70px;background:#e8eeee;display:flex;align-items:center;gap:9px;padding:0 22px;font-size:14px;color:#60767d;letter-spacing:1px}.wtop i{width:11px;height:11px;border-radius:50%;background:#9eb2b3}
          .cols,.r{display:grid;grid-template-columns:1.3fr .8fr .8fr;gap:6px;align-items:center;padding:22px 20px}.cols{font-size:12px;letter-spacing:2px;color:#789096}.r{border-top:1px solid #e1e9e9;font-size:14px}.r b{font-size:15px}.r em{font-size:12px;font-style:normal;color:#187566;background:#e2f2ed;border-radius:20px;padding:8px;text-align:center}
          .mail{display:flex;align-items:center;gap:16px;background:#1a3943;border:1px solid rgba(141,226,193,.24);padding:22px;border-radius:20px;margin:34px 0 0 35px}.mailicon{width:50px;height:50px;border-radius:14px;background:#225d59;display:grid;place-items:center;font-size:23px;color:#9ce7cc}.mail b{display:block;font-size:17px}.mail small{display:block;color:#9db3b8;font-size:13px;margin-top:7px}.mail>span{margin-left:auto;color:#8de2c1}
          .cta{text-align:center;padding-top:80px}.orb{width:190px;height:190px;border-radius:50%;margin:0 auto 38px;border:1px solid rgba(141,226,193,.5);background:radial-gradient(circle at 35% 30%,#276f64,#102d35 72%);display:grid;place-items:center;box-shadow:0 0 90px rgba(49,160,130,.18)}.orb span{font-size:92px;font-weight:800;color:#d7f8e9}
          .brand{font-size:43px;letter-spacing:11px;font-weight:800}.subbrand{font-size:15px;letter-spacing:5px;color:#8de2c1;margin-top:14px}.pill{margin:62px auto 0;background:#8de2c1;color:#08221b;border-radius:18px;padding:25px 20px;font-size:17px;font-weight:800;max-width:440px}.tiny{margin-top:30px;color:#9bb2b7;font-size:16px}
          .copy{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.visual{animation:floatin .95s cubic-bezier(.2,.8,.2,1) both}
          @keyframes rise{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}@keyframes floatin{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
          """
          def vis(kind,lang):
            fr=lang=="fr"
            if kind in ("messages","night"):
              texts=("Bonjour, avez-vous un créneau ?","Appel manqué · 09:42","Jeudi après-midi ?") if fr else ("Can I book for tomorrow?","Message received · 10:47 PM","No reply until morning?")
              return f'''<div class="visual stack" data-enter="zoom"><div class="vlabel">{'DEMANDES ENTRANTES' if fr else 'INCOMING REQUESTS'}</div>
              <div class="notice"><span class="dot mint"></span><div><b>{texts[0]}</b><small>Message</small></div><em>09:41</em></div>
              <div class="notice"><span class="dot amber"></span><div><b>{texts[1]}</b><small>{'Téléphone' if fr else 'Phone'}</small></div><em>09:42</em></div>
              <div class="notice"><span class="dot blue"></span><div><b>{texts[2]}</b><small>Message</small></div><em>09:44</em></div>
              <div class="scatter">{'Plusieurs canaux. Une seule équipe.' if fr else 'Different channels. One busy team.'}</div></div>'''
            if kind in ("booking","booking_en"):
              return f'''<div class="visual phonewrap" data-enter="zoom"><div class="phone"><div class="island"></div><div class="phead"><b>RENDEVO</b><span>•••</span></div>
              <div class="ptitle">{'Prendre rendez-vous' if fr else 'Book an appointment'}</div><div class="pcap">{'EXEMPLE DE PARCOURS' if fr else 'ILLUSTRATIVE FLOW'}</div>
              <div class="flabel">{'Choisir un service' if fr else 'Choose a service'}</div><div class="field"><b>Consultation</b><span>⌄</span></div>
              <div class="flabel">{'Choisir une date' if fr else 'Choose a date'}</div><div class="date"><b>{'14 NOV · JEUDI' if fr else 'NOV 14 · THURSDAY'}</b></div>
              <div class="flabel">{'Horaire' if fr else 'Time'}</div><div class="field selected"><b>{'10:30 · Disponible' if fr else '10:30 AM · Available'}</b><span>✓</span></div>
              <div class="send">{'Envoyer la demande' if fr else 'Send request'}　→</div></div></div>'''
            if kind in ("calendar","calendar_en"):
              return f'''<div class="visual" data-enter="zoom"><div class="calendar"><div class="calhead"><b>{'CHOISIR UNE DATE' if fr else 'CHOOSE A DATE'}</b><span>{'NOVEMBRE' if fr else 'NOVEMBER'}</span></div><div class="days">
              <div class="day">16</div><div class="day">17</div><div class="day active">18</div><div class="day">19</div><div class="day busy">20</div><div class="day">21</div><div class="day">22</div>
              <div class="day">23</div><div class="day">24</div><div class="day">25</div><div class="day">26</div><div class="day">27</div><div class="day">28</div><div class="day">29</div></div>
              <div class="slots"><span class="slot">09:00</span><span class="slot">09:15</span><span class="slot">10:30</span></div></div></div>'''
            if kind in ("sheet","sheet_en"):
              return f'''<div class="visual workspace" data-enter="zoom"><div class="window"><div class="wtop"><i></i><i></i><i></i><b>{'SUIVI DES RENDEZ-VOUS' if fr else 'APPOINTMENT OVERVIEW'}</b></div>
              <div class="cols"><span>SERVICE</span><span>DATE</span><span>{'STATUT' if fr else 'STATUS'}</span></div>
              <div class="r"><b>Consultation</b><span>14 NOV</span><em>{'Reçu' if fr else 'Received'}</em></div>
              <div class="r"><b>{'Contrôle' if fr else 'Follow-up'}</b><span>15 NOV</span><em>{'Confirmé' if fr else 'Confirmed'}</em></div>
              <div class="r"><b>{'Nouvelle demande' if fr else 'New request'}</b><span>16 NOV</span><em>{'À traiter' if fr else 'To review'}</em></div></div>
              <div class="mail"><div class="mailicon">✉</div><div><b>{'Confirmation par e-mail' if fr else 'Email confirmation'}</b><small>{'Votre demande a bien été reçue.' if fr else 'Your request has been received.'}</small></div><span>✓</span></div></div>'''
            return f'''<div class="visual cta" data-enter="zoom"><div class="orb"><span>R</span></div><div class="brand">RENDEVO</div><div class="subbrand">BOOKING SYSTEMS</div>
              <div class="pill">{'ÉCRIVEZ « RENDEVO » EN DM' if fr else 'DM “BOOKING” TO TALK'}　↗</div><div class="tiny">{'Demande en ligne · Suivi · E-mail' if fr else 'Online request · Admin view · Email'}</div></div>'''
          def music(path,dur):
            sr=48000; chords=((73.42,110,146.83,220),(65.41,98,130.81,196),(55,82.41,110,164.81),(61.74,92.5,123.47,185)); a=array.array("h")
            for i in range(int(sr*dur)):
              t=i/sr; chord=chords[min(int(t/5.2),3)]
              pad=sum(math.sin(2*math.pi*f*t+j*.22) for j,f in enumerate(chord))*.0042
              beat=t%0.78; kick=math.sin(2*math.pi*58*t)*math.exp(-beat*25)*.018
              tick=math.sin(2*math.pi*1650*t)*math.exp(-((beat-.025)/.012)**2)*.0028
              fade=min(1,t,max(0,(dur-t)/1.1)); v=max(-.08,min(.08,(pad+kick+tick)*fade))
              a.append(int(v*32767)); a.append(int((v*.96+math.sin(2*math.pi*chord[2]*t)*.0006)*32767))
            with wave.open(str(path),"wb") as w:
              w.setnchannels(2);w.setsampwidth(2);w.setframerate(sr);w.writeframes(a.tobytes())
          def page(lang,scenes,durs):
            parts=[]
            for (ey,head,body,voice,kind),dur in zip(scenes,durs):
              parts.append(f'''<section class="scene" data-duration="{dur:.3f}" data-camera="push 1.035">
              <div class="top"><div class="logo">RENDE<span>VO</span></div><div class="topnote">{'SYSTÈMES DE RÉSERVATION' if lang=='fr' else 'BOOKING SYSTEMS'}</div></div>
              <div class="content"><div class="copy" data-enter="fade-up"><div class="eyebrow">{html.escape(ey)}</div><h1>{html.escape(head)}</h1><div class="body">{html.escape(body)}</div></div>{vis(kind,lang)}</div>
              <div class="footer"><span>{'MOINS D’ADMINISTRATION' if lang=='fr' else 'LESS ADMIN'}</span><b>@RENDEVO.DZ</b></div></section>''')
            return f'<!doctype html><html lang="{lang}" data-width="1080" data-height="1920" data-fps="30"><head><meta charset="utf-8"><style>{css}</style></head><body><main data-sequence>{"".join(parts)}</main></body></html>'
          for lang,d in data.items():
            wavs=[]; speech=[]; padded=[]
            for i,scene in enumerate(d["scenes"],1):
              mp3=TMP/f"{lang}-{i}.mp3"; wav=TMP/f"{lang}-{i}.wav"
              cmd([".venv/bin/edge-tts","--voice",d["voice"],"--rate=-4%","--text",scene[3],"--write-media",str(mp3)])
              cmd(["ffmpeg","-y","-i",str(mp3),"-af","apad=pad_dur=0.18","-ar","48000","-ac","1",str(wav)])
              speech.append(duration(mp3));padded.append(duration(wav));wavs.append(wav)
            total=sum(padded)
            pathlib.Path(f"compositions/daily-{lang}.html").write_text(page(lang,d["scenes"],padded),encoding="utf-8")
            with wave.open(str(wavs[0]),"rb") as first:
              params=first.getparams()
              with wave.open(str(OUT/f"{lang}-voice.wav"),"wb") as dst:
                dst.setparams(params)
                for p in wavs:
                  with wave.open(str(p),"rb") as src: dst.writeframes(src.readframes(src.getnframes()))
            music(OUT/f"{lang}-music.wav",total)
            cursor=0; cues=[]
            for i,(scene,sp,pad) in enumerate(zip(d["scenes"],speech,padded),1):
              cues.append(f"{i}\n{stamp(cursor)} --> {stamp(cursor+sp)}\n{wrap(scene[3],34 if lang=='fr' else 38)}\n")
              cursor+=pad
            (OUT/f"{lang}.srt").write_text("\n".join(cues),encoding="utf-8")
            (OUT/f"{lang}-caption.txt").write_text(d["caption"]+"\n\n"+d["tags"]+"\n\nVOICEOVER:\n"+"\n".join(x[3] for x in d["scenes"]),encoding="utf-8")
            print(f"Prepared {lang}: {total:.2f}s, female neural voice.")
          plan="""# RENDEVO content package — 14 November 2026

          ## Finished Reel 1 — French / Algeria
          **Hook:** WhatsApp n’est pas un agenda.
          **Audience:** Algerian clinics and appointment-based businesses.
          **Format:** 9:16, 1080×1920, 30–40s, French female neural voice, burned-in subtitles, original ambient music.
          **Caption:** Les demandes arrivent sur plusieurs canaux ? Un parcours de réservation clair peut aider votre équipe à mieux les suivre. RENDEVO crée des systèmes adaptés aux activités sur rendez-vous. Écrivez « RENDEVO » en DM pour en parler.
          **Hashtags:** #RENDEVO #Oran #Algerie #ReservationEnLigne #CabinetMedical #EntrepriseAlgerienne
          **CTA:** Écrivez « RENDEVO » en DM.

          ## Finished Reel 2 — English / International
          **Hook:** 10:47 PM. Someone wants to book.
          **Audience:** International appointment-based businesses.
          **Format:** 9:16, 1080×1920, 30–40s, English female neural voice, burned-in subtitles, original ambient music.
          **Caption:** A customer shouldn’t have to wait for opening hours just to send a booking request. RENDEVO builds booking systems around appointment-based businesses. DM “BOOKING” to discuss your workflow.
          **Hashtags:** #RENDEVO #OnlineBooking #SmallBusiness #AppointmentBooking #BusinessSystems
          **CTA:** DM “BOOKING” to talk.

          ## Backup queue

          ### 1. Two people. One time slot?
          - **Hook:** « Deux patients. Le même créneau ? »
          - **Format/language:** 15–20 second French split-screen Reel.
          - **Scenes:** Two requests arrive for one slot; show the occupied calendar slot; explain that RENDEVO checks existing bookings before offering availability; end card.
          - **Caption:** Les conflits de créneaux compliquent la journée de toute l’équipe. Un système qui vérifie les disponibilités aide à garder un planning plus clair.
          - **CTA:** Envoyez « RENDEVO » en DM.
          - **Audience:** Algerian clinics.

          ### 2. Your receptionist is doing five jobs at once
          - **Hook:** “Answer. Check. Write it down. Confirm. Repeat.”
          - **Format/language:** 20-second English mini-story with quick cuts.
          - **Scenes:** Receptionist switches between phone, notes and calendar; show a structured booking flow; show admin view and email confirmation; end with a question about their current process.
          - **Caption:** Appointment admin can become a second job. A clearer booking journey can make requests easier to track.
          - **CTA:** DM “BOOKING” to discuss your workflow.
          - **Audience:** International clinics, consultants and service businesses.

          ### 3. The salon is closed. The booking page isn’t.
          - **Hook:** « 21h30. Votre prochain client cherche déjà un créneau. »
          - **Format/language:** 15–25 second French cinematic mini-commercial.
          - **Scenes:** Closed salon exterior; customer views an illustrative mobile booking page; service/date/time request is sent; RENDEVO end card. Do not imply an existing salon deployment.
          - **Caption:** Même après la fermeture, vos clients peuvent consulter une page de réservation et envoyer leur demande en ligne. Parlons d’un parcours adapté à votre activité.
          - **CTA:** Écrivez « RENDEVO » en DM.
          - **Audience:** Algerian salons and other appointment-based businesses.

          **Publishing:** Post the French Reel first, then publish the English version separately. Use the first frame as the cover. Review the voice and subtitles before posting. Never present illustrative UI as a client result or testimonial.
          """
          (OUT/"CONTENT_PLAN.md").write_text(plan,encoding="utf-8")
          PY
          python3 /tmp/build.py
      - name: Render, subtitle, mix and verify
        env:
          GIVEMOTION_NO_SANDBOX: "1"
        run: |
          set -e
          for lang in fr en; do
            up=$(printf '%s' "$lang" | tr '[:lower:]' '[:upper:]')
            npx givemotion render "compositions/daily-$lang.html" -o "out/$lang-silent.mp4" --quality standard
            ffmpeg -y -i "out/$lang-silent.mp4" -i "out/$lang-voice.wav" -i "out/$lang-music.wav" \
              -filter_complex "[0:v]subtitles=out/$lang.srt:original_size=1080x1920:force_style='FontName=DejaVu Sans,FontSize=32,PrimaryColour=&H00FFFFFF,OutlineColour=&H90000000,BorderStyle=1,Outline=3,Shadow=0,Alignment=2,MarginV=235,MarginL=72,MarginR=72'[vout];[1:a]volume=1.0[v];[2:a]volume=0.22[m];[v][m]amix=inputs=2:duration=first:dropout_transition=1[a]" \
              -map "[vout]" -map "[a]" -c:v libx264 -preset medium -crf 19 -pix_fmt yuv420p -r 30 -c:a aac -b:a 192k -shortest -movflags +faststart "out/RENDEVO_"$up"_2026-11-14.mp4"
            ffmpeg -y -ss 0.8 -i "out/RENDEVO_"$up"_2026-11-14.mp4" -frames:v 1 -q:v 2 "out/RENDEVO_"$up"_cover.jpg"
            ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -show_entries format=duration -of json "out/RENDEVO_"$up"_2026-11-14.mp4" > "out/"$lang"-verification.json"
            cat "out/"$lang"-verification.json"
          done
          python3 - <<'PY'
          import json, pathlib
          for lang in ("fr","en"):
            d=json.loads(pathlib.Path(f"out/{lang}-verification.json").read_text())
            v=next(s for s in d["streams"] if s.get("codec_type")=="video")
            sec=float(d["format"]["duration"])
            assert v["codec_name"]=="h264" and v["width"]==1080 and v["height"]==1920
            assert 25 <= sec <= 45, (lang,sec)
            print(f"VERIFIED {lang}: H.264 1080x1920, {sec:.2f}s")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RENDEVO-Daily-Reels-2026-11-14
          path: |
            out/RENDEVO_*.mp4
            out/RENDEVO_*_cover.jpg
            out/*-caption.txt
            out/*.srt
            out/CONTENT_PLAN.md
            out/*-verification.json
          if-no-files-found: error
          retention-days: 7
